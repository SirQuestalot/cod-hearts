name: Sync README to Modrinth

on:
  push:
    branches: [main]
    paths:
      - 'README.md'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Modrinth project body
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_PROJECT_READWRITE_TOKEN }}
          PROJECT_SLUG: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          BODY=$(jq -Rs . < README.md)

          echo "Sending README body to Modrinth..."
          HTTP_CODE=$(curl -sS -o /tmp/modrinth_response.txt -w "%{http_code}" \
            -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_SLUG}" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"body\": $BODY}")

          echo "Modrinth HTTP status: $HTTP_CODE"
          cat /tmp/modrinth_response.txt

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: Modrinth API request failed"
            exit 1
          fi

          echo "README sync completed successfully."
