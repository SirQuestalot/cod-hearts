# =============================================================================
# Build projects (+ optional publish)
# -----------------------------------------------------------------------------
# Manual workflow: pick format_lookup.json keys, build resource-pack zips,
# write metadata.json, run local validate_artifact on the output directory,
# then upload a run-scoped artifact.
# Optionally publish every entry to Modrinth (re-validates after download,
# then identity checks, then creates with retries).
# -----------------------------------------------------------------------------
# Companion scripts:
#   .github/scripts/build_artifact.py
#   .github/scripts/validate_artifact.py
#   .github/scripts/publish_to_modrinth.py
#   .github/scripts/update_changelog.py
# =============================================================================
name: Build and Publish

concurrency:
  # Shared group across all automation workflows. cancel-in-progress is
  # false so that a second manual dispatch cannot cancel an in-flight
  # publish that has already created Modrinth versions.
  group: cod-hearts-automation
  cancel-in-progress: false

# run-name examples:
#   single | 26.3 | patch | publish
#   single | 1.6.x-1.8.x | manual (1.0.2) | no publish
#   range | 1.6.x-1.8.x, 26.3 | patch | publish
#   all | all | feature | no publish
run-name: >-
  ${{ 
    inputs.mode 
  }} | ${{
    inputs.mode == 'single' && inputs.mc_version_key_single
    || inputs.mode == 'range' && inputs.mc_version_key_range
    || 'all'
  }} | ${{
    inputs.bump == 'manual' && format('manual {0}', inputs.version_override)
    || inputs.bump
  }} | ${{ 
    inputs.publish && 'publish' || 'no publish' 
  }}

# =============================================================================
# Only workflow_dispatch: a human (or API call) starts it from the Actions UI.
# No push/tag/schedule — avoids accidental builds.
# =============================================================================
on:
  workflow_dispatch:
    # -------------------------------------------------------------------------
    # INPUTS — the form fields on "Run workflow"
    # Each input becomes available later as: ${{ inputs.<name> }}
    # -------------------------------------------------------------------------
    inputs:

      # How many format_lookup.json keys to build this run
      # single = one key | range = several | all = every key in the file
      mode:
        description: Build Mode
        type: choice
        options: [single, range, all]
        default: single

      # Must match a top-level key in format_lookup.json
      # Example: 26.3 or 1.21.9-1.21.10
      mc_version_key_single:
        description: Single key from format_lookup.json
        type: string
        required: false
        default: (for mode=single)
        # required-ness is enforced in a step below
        # Required when mode=single

      # Exactly two comma-separated keys from format_lookup.json
      # (order does not matter).
      # Builds every key between them in file key order, inclusive.
      # Example: 1.6.x-1.8.x, 26.3
      mc_version_key_range:
        description: Comma-separated keys from format_lookup.json
        type: string
        required: false
        default: (for mode=range)
        # required-ness is enforced in a step below
        # Required when mode=range

      # Affects the new version number (major.minor.patch):
      # major remains unaffected as directly tied to packformat number
      #   feature → bump .minor and drop patch to zero
      #   patch   → bump .patch
      #   manual  → use version_override exactly (mode=single only)
      bump:
        description: Bump type
        type: choice
        options: [patch, feature, manual]
        default: patch

      # Full manual version string when bump=manual (i.e. 97.0.0)
      # for manual control over version format migration, etc
      version_override:
        description: Full version number 
        type: string
        required: false
        default: (for bump=manual)
        # required-ness is enforced in a step below
        # Required when bump=manual

      # If true, merge the mods/ tree into packs that have a numeric pack_format
      include_mods:
        description: Include mod assets (1.6+ only)
        type: boolean
        default: true

      # When true, publish job runs after a successful build.
      publish:
        description: Publish to Modrinth
        type: boolean
        default: false


# =============================================================================
# JOB-LEVEL ENVIRONMENT
# -----------------------------------------------------------------------------
# Available to every step unless a step overrides a name.
# Keeps paths/API bases in one place instead of scattering magic strings.
# The Python script reads these same names.
# Paths are relative to the repo root after checkout.
# =============================================================================
env:
  LOOKUP_FILE: .github/format_lookup.json
  CONTENT_ROOT: core/content
  META_ROOT: core/meta
  MODS_ROOT: mods
  BUILD_SCRIPT: .github/scripts/build_artifact.py
  VALIDATE_SCRIPT: .github/scripts/validate_artifact.py
  ARTIFACT_NAME: >-
    ${{
      'run-artifact'
    }}_${{
      inputs.mode 
    }}_${{
      inputs.mode == 'single' && inputs.mc_version_key_single
      || inputs.mode == 'range' && inputs.mc_version_key_range
      || 'all'
    }}_${{
      inputs.bump == 'manual' && format('manual-{0}', inputs.version_override)
      || inputs.bump
    }}_${{ 
      inputs.publish && 'publish' || 'nopublish' 
    }}_${{ 
      github.run_id 
    }}
  PUBLISH_SCRIPT: .github/scripts/publish_to_modrinth.py
  CHANGELOG_SCRIPT: .github/scripts/update_changelog.py
  BUNDLE_SCRIPT: .github/scripts/build_release_bundle.py
  RESIDUALS_SCRIPT: .github/scripts/report_residuals.py
  MODRINTH_API: https://api.modrinth.com/v2
  GITHUB_API: https://api.github.com
  OUT_DIR: build/dist
  PACK_ICON: core/pack.png
  LICENSE_FILE: LICENSE.txt
  CHANGELOG_FILE: CHANGELOG.md
  # Full URL used in Modrinth changelog footer (edit path/branch here if needed)
  CHANGELOG_URL: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
  CHANGELOG_FOOTER_LABEL: Full project changelog
  PROJECT_TYPE: resourcepack
  # where zips + metadata.json are written on the VM.
  # upload-artifact packs this folder for the workflow run.

# =============================================================================
# JOBS
# -----------------------------------------------------------------------------
# build: validate inputs → github meta → build script (includes local
#        artifact validation) → upload artifact
# Changelog body comes from CHANGELOG.md ## [Unreleased] (not an input).
# publish (optional): download → validate → identity → create (shared changelog_body)
# =============================================================================
jobs:
  build:
    # Fresh Ubuntu VM (ephemeral; wipes after run)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # STEP: Checkout
      # -----------------------------------------------------------------------
      # actions/checkout clones this repo into the workspace so later steps
      # can read format_lookup.json, core/, mods/, and the Python script.
      # Without this, the runner has no project files.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # STEP: Validate inputs and resolve which lookup keys this run will build.
      # -----------------------------------------------------------------------
      # Validate the form inputs and compute the list of mc version keys to build.
      #
      # This step is pure bash. It does NOT build zips. It only:
      #   1) Enforces input combinations (single needs an mc version key, range needs two, etc.)
      #   2) Reads every mc version key from format_lookup.json
      #   3) Builds the list TARGETS of mc version keys this run will process
      #   4) Writes that list to GITHUB_OUTPUT as a multiline "targets" value
      #       - steps.plan.outputs.targets (newline-separated keys for the script)
      # -----------------------------------------------------------------------
      - name: Validate inputs and resolve keys
        id: plan
        env:
          MODE: ${{ inputs.mode }}
          MC_VERSION_KEY_SINGLE: ${{ inputs.mc_version_key_single }}
          MC_VERSION_KEY_RANGE: ${{ inputs.mc_version_key_range }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "Error: $CHANGELOG_FILE not found"
            exit 1
          fi
          if [ ! -f "$LOOKUP_FILE" ]; then
            echo "Error: $LOOKUP_FILE not found"
            exit 1
          fi
          if [ ! -f "$BUILD_SCRIPT" ]; then
            echo "Error: $BUILD_SCRIPT not found"
            exit 1
          fi
          if [ ! -f "$VALIDATE_SCRIPT" ]; then
            echo "Error: $VALIDATE_SCRIPT not found (required by build_artifact.py)"
            exit 1
          fi
          python3 "$BUILD_SCRIPT" resolve-targets

      - name: Fetch GitHub description and license
        id: github_meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Repo metadata JSON (includes .description = GitHub "About")
          REPO_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API/repos/$REPO")

          ABOUT=$(echo "$REPO_JSON" | jq -r '.description // empty')

          # Keep only whitespace-separated tokens that are fully ASCII.
          # Non-ASCII tokens (kaomoji, symbols, mixed emoji words) are dropped
          # due to rendering improperly within minecraft.
          #
          # python3 - <<'STRIP_END'  →  shell "heredoc": the following lines are
          # fed to Python as its program text (stdin) until a line that is only
          # STRIP_END. Quotes on 'STRIP_END' mean the shell does not expand
          # $variables inside the block before Python sees them.
          DESCRIPTION=$(python3 - <<'STRIP_END' "$ABOUT"
          import sys
          about = sys.argv[1] if len(sys.argv) > 1 else ""
          parts = about.split()
          kept = [p for p in parts if p.isascii()]
          print(" ".join(kept), end="")
          STRIP_END
          )
          # If everything was stripped, error
          if [ -z "${DESCRIPTION// }" ]; then
            echo "Error: GitHub About produced an empty description after stripping non-ASCII tokens"
            echo "Raw About: ${ABOUT:-<empty>}"
            exit 1
          fi

          # License detection JSON from GitHub
          # GET /repos/{owner}/{repo}/license → detected license metadata
          LICENSE_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API/repos/$REPO/license")

          LICENSE_NAME=$(echo "$LICENSE_JSON" | jq -r '.license.name // empty')
          LICENSE_SPDX=$(echo "$LICENSE_JSON" | jq -r '.license.spdx_id // empty')

          # Prefer human-readable name, then SPDX id, then a safe fallback
          if [ -n "$LICENSE_NAME" ] && [ "$LICENSE_NAME" != "null" ]; then
            LICENSE="$LICENSE_NAME"
          elif [ -n "$LICENSE_SPDX" ] && [ "$LICENSE_SPDX" != "null" ] && [ "$LICENSE_SPDX" != "NOASSERTION" ]; then
            LICENSE="$LICENSE_SPDX"
          else
            LICENSE="See LICENSE.txt"
          fi

          echo "Description: $DESCRIPTION"
          echo "License: $LICENSE"

          # Multiline step outputs (same marker style as targets above)
          {
            echo "description<<DESCRIPTION_END"
            printf '%s\n' "$DESCRIPTION"
            echo "DESCRIPTION_END"
            echo "license<<LICENSE_END"
            printf '%s\n' "$LICENSE"
            echo "LICENSE_END"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP: Build zips and metadata for artifact
      # -----------------------------------------------------------------------
      # Hands off to the external Python script. All real build logic lives there:
      #   - parse lookup rows
      #   - pick content/meta folders by game-version span vs folder names
      #   - resolve version numbers from Modrinth API (or manual)
      #   - render template placeholders
      #   - zip packs
      #   - write metadata.json
      # metadata includes changelog_body plus entries with version_number, game_versions, file
      # name, etc., so the publish job can upload without rebuilding.
      #
      # Environment variables are the script’s only configuration interface.
      # -----------------------------------------------------------------------
      - name: Build zips and metadata
        env:
          PROJECT_SLUG: ${{ github.event.repository.name }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          INCLUDE_MODS: ${{ inputs.include_mods }}
          # CHANGELOG_FILE from job-level env; Unreleased section read by the script
          # From previous steps:
          DESCRIPTION: ${{ steps.github_meta.outputs.description }}
          LICENSE: ${{ steps.github_meta.outputs.license }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          # LOOKUP_FILE, CONTENT_ROOT, META_ROOT, MODS_ROOT, MODRINTH_API, OUT_DIR
          # come from the job-level env: block above
        run: python3 "$BUILD_SCRIPT"

      # -----------------------------------------------------------------------
      # STEP: Upload artifacts
      # -----------------------------------------------------------------------
      # Stores build/dist/ (all zips + metadata.json) on GitHub’s artifact storage
      # for this workflow run. Only runs if build_artifact.py succeeded, including
      # validate_artifact(). You can download them from the run page, or the
      # publish job can pull them automatically.
      #
      # ${{ env.ARTIFACT_NAME }}  ← publish job must use this same name 
      #                             when finding the artifact
      # -----------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: build/dist/
          if-no-files-found: error   # fail the job if the script produced nothing

  # ---------------------------------------------------------------------------
  # Publish to Modrinth
  # ---------------------------------------------------------------------------
  # Re-validate the downloaded artifact, identity-check the project, then
  # create each version (oldest first) with retries. On partial failure
  # residuals list the versions already on Modrinth.
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: get_approval
    outputs:
      entry_n: ${{ steps.publish_versions.outputs.entry_n }}
      changelog_date: ${{ steps.publish_versions.outputs.changelog_date }}
      versions_json: ${{ steps.publish_versions.outputs.versions_json }}
      project_slug: ${{ steps.publish_versions.outputs.project_slug }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Publish versions to Modrinth
        id: publish_versions
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_VERSION_CREATE_TOKEN }}
          MODRINTH_API: ${{ env.MODRINTH_API }}
          DIST_DIR: dist
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
          CHANGELOG_URL: ${{ env.CHANGELOG_URL }}
          CHANGELOG_FOOTER_LABEL: ${{ env.CHANGELOG_FOOTER_LABEL }}
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "Error: MODRINTH_TOKEN is not set"
            exit 1
          fi
          python3 "$PUBLISH_SCRIPT"

  # ---------------------------------------------------------------------------
  # Record successful publish in CHANGELOG.md (sequence section + clear Unreleased)
  # ---------------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Changelog: promote [Unreleased] into a numbered ## [n] section and
  # push the updated CHANGELOG.md. Residuals on failure list any
  # Modrinth versions created by the preceding publish job.
  # ------------------------------------------------------------------
  changelog:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit_changelog.outputs.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Promote Unreleased into CHANGELOG.md
        env:
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
          DIST_DIR: dist
          CHANGELOG_ENTRY: ${{ needs.publish.outputs.entry_n }}
          CHANGELOG_DATE: ${{ needs.publish.outputs.changelog_date }}
          CHANGELOG_VERSIONS_JSON: ${{ needs.publish.outputs.versions_json }}
          PROJECT_SLUG: ${{ needs.publish.outputs.project_slug }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHANGELOG_SCRIPT" ]; then
            echo "Error: $CHANGELOG_SCRIPT not found"
            exit 1
          fi
          python3 "$CHANGELOG_SCRIPT" promote

      - name: Commit and push CHANGELOG.md
        id: commit_changelog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No CHANGELOG.md changes to commit"
          else
            git commit -m "Update CHANGELOG.md"
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: On failure — residual cleanup guidance
        if: failure()
        env:
          RESIDUAL_STAGE: changelog
          RESIDUAL_OUTCOME: failure
          CHANGELOG_VERSIONS_JSON: ${{ needs.publish.outputs.versions_json }}
          CHANGELOG_ENTRY: ${{ needs.publish.outputs.entry_n }}
          CHANGELOG_DATE: ${{ needs.publish.outputs.changelog_date }}
          PROJECT_SLUG: ${{ needs.publish.outputs.project_slug }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
        run: |
          set -euo pipefail
          python3 "$RESIDUALS_SCRIPT"

  # ---------------------------------------------------------------------------
  # GitHub Release (tag + notes matching changelog section + pack zips)
  # ---------------------------------------------------------------------------
  # ------------------------------------------------------------------
  # Release: build aggregate zip, write release notes, create the
  # GitHub Release and attach assets. Residuals on failure list the
  # already-published Modrinth versions and any CHANGELOG commit.
  # ------------------------------------------------------------------
  release:
    needs:
      - publish
      - changelog
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.changelog.outputs.sha }}

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist

      - name: Build release notes
        env:
          DIST_DIR: dist
          CHANGELOG_ENTRY: ${{ needs.publish.outputs.entry_n }}
          CHANGELOG_DATE: ${{ needs.publish.outputs.changelog_date }}
          CHANGELOG_VERSIONS_JSON: ${{ needs.publish.outputs.versions_json }}
          PROJECT_SLUG: ${{ needs.publish.outputs.project_slug }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
        run: |
          set -euo pipefail
          if [ ! -f "$CHANGELOG_SCRIPT" ]; then
            echo "Error: $CHANGELOG_SCRIPT not found"
            exit 1
          fi
          python3 "$CHANGELOG_SCRIPT" release-notes > release-notes.md
          echo "---- release notes ----"
          cat release-notes.md

      - name: Create GitHub Release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ENTRY: ${{ needs.publish.outputs.entry_n }}
          DATE: ${{ needs.publish.outputs.changelog_date }}
          TARGET_SHA: ${{ needs.changelog.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TARGET_SHA:-}" ]; then
            echo "Error: TARGET_SHA (changelog commit) is empty"
            exit 1
          fi
          TAG="changelog${ENTRY}-${DATE}"
          TITLE="[${ENTRY}] - ${DATE}"

          META="dist/metadata.json"
          if [ ! -f "$META" ]; then
            echo "Error: missing $META"
            ls -la dist/ || true
            exit 1
          fi
          BUNDLE="dist/${TAG}.zip"
          python3 "$BUNDLE_SCRIPT" \
            --metadata "$META" \
            --zips-dir dist \
            --out "$BUNDLE" \
            --layout flat

          echo "Creating release tag=$TAG title=$TITLE target=$TARGET_SHA"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file release-notes.md \
            --target "$TARGET_SHA"

          upload_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .upload_url)"
          upload_url="${upload_url%%\{*}"
          html_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url)"

          # Record tag/URL before asset uploads so failure residuals still list them
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_url=$html_url" >> "$GITHUB_OUTPUT"

          name="$(basename "$BUNDLE")"
          name_enc="$(printf '%s' "$name" | jq -sRr @uri)"
          echo "Uploading asset basename=${name}"
          curl -sS -f -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/zip" \
            --data-binary @"$BUNDLE" \
            "${upload_url}?name=${name_enc}" \
            -o /tmp/upload-asset.json
          returned="$(jq -r '.name // empty' /tmp/upload-asset.json)"
          echo "  API response name=${returned}"
          if [ "$returned" != "$name" ]; then
            echo "Error: asset name mismatch (exact basename required)"
            echo "  expected: $name"
            echo "  got:      $returned"
            cat /tmp/upload-asset.json || true
            exit 1
          fi
          echo "  OK $name"

      - name: On failure — residual cleanup guidance
        if: failure()
        env:
          RESIDUAL_STAGE: release
          RESIDUAL_OUTCOME: failure
          CHANGELOG_VERSIONS_JSON: ${{ needs.publish.outputs.versions_json }}
          CHANGELOG_ENTRY: ${{ needs.publish.outputs.entry_n }}
          CHANGELOG_DATE: ${{ needs.publish.outputs.changelog_date }}
          PROJECT_SLUG: ${{ needs.publish.outputs.project_slug }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
          RELEASE_TAG: ${{ steps.create_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
        run: |
          set -euo pipefail
          python3 "$RESIDUALS_SCRIPT"

      - name: On success — run inventory
        if: success()
        env:
          RESIDUAL_STAGE: release
          RESIDUAL_OUTCOME: success
          CHANGELOG_VERSIONS_JSON: ${{ needs.publish.outputs.versions_json }}
          CHANGELOG_ENTRY: ${{ needs.publish.outputs.entry_n }}
          CHANGELOG_DATE: ${{ needs.publish.outputs.changelog_date }}
          PROJECT_SLUG: ${{ needs.publish.outputs.project_slug }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
          RELEASE_TAG: ${{ steps.create_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
        run: |
          set -euo pipefail
          python3 "$RESIDUALS_SCRIPT"
