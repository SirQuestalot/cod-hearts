# =============================================================================
# Build projects (+ optional publish)
# -----------------------------------------------------------------------------
# Manual workflow: pick format_lookup.json keys, build resource-pack zips,
# write metadata.json, upload artifact project-build.
# Optionally publish every entry in that artifact to Modrinth.
# -----------------------------------------------------------------------------
# Companion scripts (build logic and publish):
#   .github/scripts/build_projects.py
#   .github/scripts/publish_to_modrinth.py
# =============================================================================
name: Build and Publish

# run-name examples:
#   Build: single | 26.3 | patch | publish
#   Build: single | 1.6.x-1.8.x | manual (1.0.2) | no publish
#   Build: range | 1.6.x-1.8.x, 26.3 | patch | publish
#   Build: all | all | feature | no publish
run-name: >-
  Build: ${{ inputs.mode }} | ${{
    inputs.mode == 'single' && inputs.mc_version_key_single
    || inputs.mode == 'range' && inputs.mc_version_key_range
    || 'all'
  }} | ${{
    inputs.bump == 'manual' && format('manual ({0})', inputs.version_override)
    || inputs.bump
  }} | ${{ inputs.publish && 'publish' || 'no publish' }}

# =============================================================================
# Only workflow_dispatch: a human (or API call) starts it from the Actions UI.
# No push/tag/schedule — avoids accidental builds.
# =============================================================================
on:
  workflow_dispatch:
    # -------------------------------------------------------------------------
    # INPUTS — the form fields on "Run workflow"
    # Each input becomes available later as: ${{ inputs.<name> }}
    # -------------------------------------------------------------------------
    inputs:

      # How many format_lookup.json keys to build this run
      # single = one key | range = several | all = every key in the file
      mode:
        description: Which mc versions to build
        type: choice
        options: [single, range, all]
        default: single

      # Must match a top-level key in format_lookup.json
      # Example: 26.3 or 1.21.9-1.21.10
      mc_version_key_single:
        description: One key from format_lookup.json
        type: string
        required: false
        default: (for mode=single)
        # required-ness is enforced in a step below
        # Required when mode=single

      # Exactly two comma-separated keys from format_lookup.json
      # (order does not matter).
      # Builds every key between them in file key order, inclusive.
      # Example: 1.6.x-1.8.x, 26.3
      mc_version_key_range:
        description: Comma-separated keys from format_lookup.json
        type: string
        required: false
        default: (for mode=range)
        # required-ness is enforced in a step below
        # Required when mode=range

      # Affects the new version number (major.minor.patch):
      # major remains unaffected as directly tied to packformat number
      #   feature → bump .minor and drop patch to zero
      #   patch   → bump .patch
      #   manual  → use version_override exactly (mode=single only)
      bump:
        description: New version type
        type: choice
        options: [patch, feature, manual]
        default: patch

      # Full manual version string when bump=manual (i.e. 97.0.0)
      # for manual control over version format migration, etc
      version_override:
        description: Full version number 
        type: string
        required: false
        default: (for bump=manual)
        # required-ness is enforced in a step below
        # Required when bump=manual

      # If true, merge the mods/ tree into packs that have a numeric pack_format
      include_mods:
        description: Include mod assets (1.6+ only)
        type: boolean
        default: true

      # Text stored in metadata.json as the changelog body (with auto header)
      changelog:
        description: Changelog body (diff notes)
        type: string
        required: true

      # When true, publish job runs after a successful build.
      publish:
        description: Publish built versions to Modrinth
        type: boolean
        default: false


# =============================================================================
# JOB-LEVEL ENVIRONMENT
# -----------------------------------------------------------------------------
# Available to every step unless a step overrides a name.
# Keeps paths/API bases in one place instead of scattering magic strings.
# The Python script reads these same names.
# Paths are relative to the repo root after checkout.
# =============================================================================
env:
  LOOKUP_FILE: .github/format_lookup.json
  CONTENT_ROOT: core/content
  META_ROOT: core/meta
  MODS_ROOT: mods
  BUILD_SCRIPT: .github/scripts/build_projects.py
  MODRINTH_API: https://api.modrinth.com/v2
  GITHUB_API: https://api.github.com
  OUT_DIR: build/dist
  PACK_ICON: pack.png
  LICENSE_FILE: LICENSE.txt
  # where zips + metadata.json are written on the VM.
  # upload-artifact packs this folder for the workflow run.

# =============================================================================
# JOBS
# -----------------------------------------------------------------------------
# Validate → github meta → build script → upload artifact → publish(optional)
# =============================================================================
jobs:
  build:
    # Fresh Ubuntu VM (ephemeral; wipes after run)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # STEP: Checkout
      # -----------------------------------------------------------------------
      # actions/checkout clones this repo into the workspace so later steps
      # can read format_lookup.json, core/, mods/, and the Python script.
      # Without this, the runner has no project files.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7

      # -----------------------------------------------------------------------
      # STEP: Validate inputs and resolve which lookup keys this run will build.
      # -----------------------------------------------------------------------
      # Validate the form inputs and compute the list of mc version keys to build.
      #
      # This step is pure bash. It does NOT build zips. It only:
      #   1) Enforces input combinations (single needs an mc version key, range needs two, etc.)
      #   2) Reads every mc version key from format_lookup.json
      #   3) Builds the list TARGETS of mc version keys this run will process
      #   4) Writes that list to GITHUB_OUTPUT as a multiline "targets" value
      #       - steps.plan.outputs.targets (newline-separated keys for the script)
      # -----------------------------------------------------------------------
      - name: Validate inputs and resolve keys
        id: plan
        env:
          # Copy inputs into env vars for simpler shell quoting
          MODE: ${{ inputs.mode }}
          MC_VERSION_KEY_SINGLE: ${{ inputs.mc_version_key_single }}
          MC_VERSION_KEY_RANGE: ${{ inputs.mc_version_key_range }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          # -e: exit if any command fails
          # -u: exit if we reference an unset variable
          # -o pipefail: fail if any part of a pipeline fails, not just the last stage
          set -euo pipefail

          # --- Enforce input combinations ------------------------------------
          if [ "$MC_VERSION_KEY_SINGLE" = "(for mode=single)" ]; then
            MC_VERSION_KEY_SINGLE=""
          fi

          if [ "$MC_VERSION_KEY_RANGE" = "(for mode=range)" ]; then
            MC_VERSION_KEY_RANGE=""
          fi

          if [ "$VERSION_OVERRIDE" = "(for bump=manual)" ]; then
            VERSION_OVERRIDE=""
          fi

          if [ "$MODE" = "single" ] && [ -z "${MC_VERSION_KEY_SINGLE// }" ]; then
            echo "Error: mc_version_key_single is required when mode=single"
            exit 1
          fi

          if [ "$MODE" = "range" ] && [ -z "${MC_VERSION_KEY_RANGE// }" ]; then
            echo "Error: mc_version_key_range is required when mode=range"
            exit 1
          fi

          if [ "$BUMP" = "manual" ]; then
            if [ "$MODE" != "single" ]; then
              echo "Error: bump=manual is only allowed when mode=single"
              exit 1
            fi
            if [ -z "${VERSION_OVERRIDE// }" ]; then
              echo "Error: version_override is required when bump=manual"
              exit 1
            fi
          fi

          # verifies changelog input is not whitespace-only values or empty API triggers
          if [ -z "${CHANGELOG// }" ]; then
            echo "Error: changelog is required"
            exit 1
          fi

          if [ ! -f "$LOOKUP_FILE" ]; then
            echo "Error: $LOOKUP_FILE not found"
            exit 1
          fi

          if [ ! -f "$BUILD_SCRIPT" ]; then
            echo "Error: $BUILD_SCRIPT not found"
            exit 1
          fi

          # =============================================================================
          # Load keys from format_lookup.json (preserve file key order)
          # -----------------------------------------------------------------------------
          # ALL_KEYS = every top-level JSON key, in file order
          # (e.g. 26.3, 26.2, …, 1.0-1.5.x).
          # mode=range uses that order for “everything between A and B”.
          # =============================================================================

          # jq -e: run the filter; exit status is failure if the result is false/null.
          # 'type == "object"': true only if the root JSON value is { ... }, not [ ... ]
          # or a bare string/number.
          # >/dev/null: we only care about success/failure, not the printed "true".
          # if ! …: enter the error branch when the check fails.
          if ! jq -e 'type == "object"' "$LOOKUP_FILE" >/dev/null; then
            echo "Error: $LOOKUP_FILE must be a JSON object keyed by version key"
            exit 1
          fi

          # mapfile -t ALL_KEYS: read lines into array ALL_KEYS (-t strips newlines).
          # < <(...): process substitution — run the command in (...) and feed its
          # stdout to mapfile as if it were a file.
          #
          # jq -r 'keys_unsorted[]':
          #   keys_unsorted  → list of object keys in file order (not alphabetical;
          #                    plain "keys" would sort them).
          #   []             → output one key per line
          #   -r             → raw strings (no JSON quotes around each key)
          mapfile -t ALL_KEYS < <(jq -r 'keys_unsorted[]' "$LOOKUP_FILE")

          # ${#ALL_KEYS[@]} = number of elements in the array
          if [ "${#ALL_KEYS[@]}" -eq 0 ]; then
            echo "Error: $LOOKUP_FILE has no keys"
            exit 1
          fi

          # -----------------------------------------------------------------------------
          # resolve_key WANT
          # -----------------------------------------------------------------------------
          # If WANT is in ALL_KEYS, print it and return 0 (success).
          # Otherwise print an error to stderr and return 1 (failure).
          # Used so mode=single / range endpoints must be real lookup keys.
          # -----------------------------------------------------------------------------
          resolve_key() {
            # local: variables only exist inside this function
            # $1 = first argument passed to the function
            local want="$1" key
            for key in "${ALL_KEYS[@]}"; do
              # { echo ...; return 0; } runs both commands if the match succeeds
              [ "$key" = "$want" ] && { echo "$key"; return 0; }
            done
            # >&2 = send this message to stderr (not mixed with the normal "print key" stdout)
            echo "Error: key not found in $LOOKUP_FILE: '$want'" >&2
            return 1
          }

          # -----------------------------------------------------------------------------
          # index_of_key WANT
          # -----------------------------------------------------------------------------
          # Print the 0-based index of WANT inside ALL_KEYS (0 = first key in the file).
          # Used by mode=range to know where the slice starts and ends.
          # "${!ALL_KEYS[@]}" expands to all indices: 0 1 2 … 
          # -----------------------------------------------------------------------------
          index_of_key() {
            local want="$1" i
            for i in "${!ALL_KEYS[@]}"; do
              if [ "${ALL_KEYS[$i]}" = "$want" ]; then
                echo "$i"
                return 0
              fi
            done
            echo "Error: key not found in $LOOKUP_FILE: '$want'" >&2
            return 1
          }

          # =============================================================================
          # Build TARGETS from mode
          # -----------------------------------------------------------------------------
          # TARGETS = ordered list of format_lookup.json keys this workflow run will build.
          # Starts empty; the case below fills it from MODE + the relevant inputs.
          # =============================================================================
          TARGETS=()

          case "$MODE" in

            # ---------------------------------------------------------------------------
            # mode=single
            # ---------------------------------------------------------------------------
            # User supplied one key (e.g. "26.3").
            # 1) Trim whitespace from the input with xargs.
            # 2) resolve_key: confirm it exists in ALL_KEYS (else error).
            # 3) Append that one key to TARGETS.
            # ---------------------------------------------------------------------------
            single)
              TARGETS+=("$(resolve_key "$(echo "$MC_VERSION_KEY_SINGLE" | xargs)")")
              ;;

            # ---------------------------------------------------------------------------
            # mode=range
            # ---------------------------------------------------------------------------
            # User supplied two endpoints in one string, comma-separated, e.g.
            #   "1.6.x-1.8.x, 26.3"
            # We take every key in ALL_KEYS from one endpoint through the other
            # (inclusive), using **file order**, not Minecraft version sorting.
            # Endpoint order in the input does not matter.
            # ---------------------------------------------------------------------------
            range)
              # Collect non-empty pieces after splitting on commas
              ENDPOINTS=()
              # IFS=',' → split on commas only for this read
              # -ra RAW → read into array RAW
              # <<< "$MC_VERSION_KEY_RANGE" → use that string as input
              IFS=',' read -ra RAW <<< "$MC_VERSION_KEY_RANGE"

              for item in "${RAW[@]}"; do
                # Trim spaces around each piece (" 26.3" → "26.3")
                item="$(echo "$item" | xargs)"
                # Skip empty pieces (e.g. trailing comma)
                [ -z "$item" ] && continue
                ENDPOINTS+=("$item")
              done

              # Must be exactly two endpoints — not 0, 1, or 3+
              if [ "${#ENDPOINTS[@]}" -ne 2 ]; then
                echo "Error: mode=range requires exactly two comma-separated keys (start, end)"
                echo "Got ${#ENDPOINTS[@]} endpoint(s) from: $MC_VERSION_KEY_RANGE"
                exit 1
              fi

              # Confirm both keys exist in the lookup file (errors if not)
              START_KEY="$(resolve_key "${ENDPOINTS[0]}")"
              END_KEY="$(resolve_key "${ENDPOINTS[1]}")"

              # Numeric positions of those keys inside ALL_KEYS (0-based)
              START_I="$(index_of_key "$START_KEY")"
              END_I="$(index_of_key "$END_KEY")"

              # Normalize so START_I is the earlier index in the file and END_I the later.
              # That way "26.3, 1.6.x-1.8.x" and "1.6.x-1.8.x, 26.3" select the same slice.
              if [ "$START_I" -gt "$END_I" ]; then
                TMP="$START_I"
                START_I="$END_I"
                END_I="$TMP"
              fi

              # How many keys are in the inclusive span [START_I, END_I]
              LENGTH=$((END_I - START_I + 1))

              # Bash array slice: from index START_I, take LENGTH elements
              # Example: ALL_KEYS indices 0..N, START_I=2, END_I=5 → keys at 2,3,4,5
              TARGETS=("${ALL_KEYS[@]:$START_I:$LENGTH}")
              ;;

            # ---------------------------------------------------------------------------
            # mode=all
            # ---------------------------------------------------------------------------
            # No extra input. Build every key in the lookup file, same order as the file.
            # ---------------------------------------------------------------------------
            all)
              TARGETS=("${ALL_KEYS[@]}")
              ;;

            # ---------------------------------------------------------------------------
            # Anything else (should not happen if the workflow input choice is trusted)
            # ---------------------------------------------------------------------------
            *)
              echo "Error: unknown mode '$MODE'"
              exit 1
              ;;
          esac

          echo "Targets (${#TARGETS[@]}): ${TARGETS[*]}"

          # --- Pass TARGETS to later steps via GITHUB_OUTPUT -----------------
          # Bash variables do not carry across steps. Writing to GITHUB_OUTPUT
          # makes steps.plan.outputs.targets available to the rest of the job.
          #
          # Multiline form:
          #   <name><<NAME_END
          #   line1
          #   line2
          #   NAME_END
          # The marker NAME_END is arbitrary; it must match on the closing line.
          {
            echo "targets<<TARGETS_END"
            printf '%s\n' "${TARGETS[@]}"
            echo "TARGETS_END"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP: Fetch GitHub description and license
      # -----------------------------------------------------------------------
      # Load repo About + detected license from GitHub for pack template fields
      # {{DESCRIPTION}} and {{LICENSE}}.
      #
      # Description: repo "About" text; non-ASCII tokens dropped.
      # License:     GitHub’s detected license long name, else SPDX, else fallback.
      #
      # Both are written to outputs for the build script as DESCRIPTION / LICENSE.
      # Outputs:
      #   steps.github_meta.outputs.description
      #   steps.github_meta.outputs.license
      # -----------------------------------------------------------------------
      - name: Fetch GitHub description and license
        id: github_meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Repo metadata JSON (includes .description = GitHub "About")
          REPO_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API/repos/$REPO")

          ABOUT=$(echo "$REPO_JSON" | jq -r '.description // empty')

          # Keep only whitespace-separated tokens that are fully ASCII.
          # Non-ASCII tokens (kaomoji, symbols, mixed emoji words) are dropped
          # due to rendering improperly within minecraft.
          #
          # python3 - <<'STRIP_END'  →  shell "heredoc": the following lines are
          # fed to Python as its program text (stdin) until a line that is only
          # STRIP_END. Quotes on 'STRIP_END' mean the shell does not expand
          # $variables inside the block before Python sees them.
          DESCRIPTION=$(python3 - <<'STRIP_END' "$ABOUT"
          import sys
          about = sys.argv[1] if len(sys.argv) > 1 else ""
          parts = about.split()
          kept = [p for p in parts if p.isascii()]
          print(" ".join(kept), end="")
          STRIP_END
          )
          # If everything was stripped, error
          if [ -z "${DESCRIPTION// }" ]; then
            echo "Error: GitHub About produced an empty description after stripping non-ASCII tokens"
            echo "Raw About: ${ABOUT:-<empty>}"
            exit 1
          fi

          # License detection JSON from GitHub
          # GET /repos/{owner}/{repo}/license → detected license metadata
          LICENSE_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API/repos/$REPO/license")

          LICENSE_NAME=$(echo "$LICENSE_JSON" | jq -r '.license.name // empty')
          LICENSE_SPDX=$(echo "$LICENSE_JSON" | jq -r '.license.spdx_id // empty')

          # Prefer human-readable name, then SPDX id, then a safe fallback
          if [ -n "$LICENSE_NAME" ] && [ "$LICENSE_NAME" != "null" ]; then
            LICENSE="$LICENSE_NAME"
          elif [ -n "$LICENSE_SPDX" ] && [ "$LICENSE_SPDX" != "null" ] && [ "$LICENSE_SPDX" != "NOASSERTION" ]; then
            LICENSE="$LICENSE_SPDX"
          else
            LICENSE="See LICENSE.txt"
          fi

          echo "Description: $DESCRIPTION"
          echo "License: $LICENSE"

          # Multiline step outputs (same marker style as targets above)
          {
            echo "description<<DESCRIPTION_END"
            printf '%s\n' "$DESCRIPTION"
            echo "DESCRIPTION_END"
            echo "license<<LICENSE_END"
            printf '%s\n' "$LICENSE"
            echo "LICENSE_END"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP: Build zips and metadata
      # -----------------------------------------------------------------------
      # Hands off to the external Python script. All real build logic lives there:
      #   - parse lookup rows
      #   - pick content/meta folders by game-version span vs folder names
      #   - resolve version numbers from Modrinth API (or manual)
      #   - render template placeholders
      #   - zip packs
      #   - write metadata.json
      # metadata entries include version_number, game_versions, changelog, file
      # name, etc., so the publish job can upload without rebuilding.
      #
      # Environment variables are the script’s only configuration interface.
      # -----------------------------------------------------------------------
      - name: Build zips and metadata
        env:
          PROJECT_SLUG: ${{ github.event.repository.name }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          INCLUDE_MODS: ${{ inputs.include_mods }}
          CHANGELOG: ${{ inputs.changelog }}
          # From previous steps:
          DESCRIPTION: ${{ steps.github_meta.outputs.description }}
          LICENSE: ${{ steps.github_meta.outputs.license }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          # LOOKUP_FILE, CONTENT_ROOT, META_ROOT, MODS_ROOT, MODRINTH_API, OUT_DIR
          # come from the job-level env: block above
        run: python3 "$BUILD_SCRIPT"

      # -----------------------------------------------------------------------
      # STEP: Upload artifacts
      # -----------------------------------------------------------------------
      # Stores build/dist/ (all zips + metadata.json) on GitHub’s artifact storage
      # for this workflow run. You can download them from the run page, or the
      # publish job can pull them.
      #
      # name: project-build  ← publish job must use this same name
      # -----------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: project-build
          path: build/dist/
          if-no-files-found: error   # fail the job if the script produced nothing

  # ---------------------------------------------------------------------------
  # Publish to Modrinth
  # ---------------------------------------------------------------------------
  publish:
    needs: build
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    environment: modrinth_publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: project-build
          path: dist

      - name: Publish versions to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_VERSION_CREATE_TOKEN }}
          MODRINTH_API: ${{ env.MODRINTH_API }}
          DIST_DIR: dist
          PUBLISH_SCRIPT: .github/scripts/publish_to_modrinth.py
        run: |
          set -euo pipefail
          if [ -z "${MODRINTH_TOKEN:-}" ]; then
            echo "Error: MODRINTH_TOKEN is not set"
            exit 1
          fi
          python3 "$PUBLISH_SCRIPT"