# =============================================================================
# WORKFLOW NAME
# -----------------------------------------------------------------------------
# Shown in the GitHub Actions tab. Also the string other workflows would use
# if they watched this one with workflow_run (e.g. workflows: ["Build Resource Packs"]).
# =============================================================================
name: Build Resource Packs

# =============================================================================
# TRIGGERS — when is this workflow allowed to start?
# -----------------------------------------------------------------------------
# Only workflow_dispatch: a human (or API call) starts it from the Actions UI.
# No push/tag/schedule — we do not want accidental builds.
# =============================================================================
on:
  workflow_dispatch:
    # -------------------------------------------------------------------------
    # INPUTS — the form fields on "Run workflow"
    # Each input becomes available later as: ${{ inputs.<name> }}
    # -------------------------------------------------------------------------
    inputs:

      # How many meta_lookup rows to build this run.
      # single = one label | list = several | all = every row in the file
      mode:
        description: Which meta_lookup rows to build
        type: choice                 # dropdown in the UI
        options: [single, list, all]
        default: single

      # Used only when mode=single. Must match the first column of a lookup row.
      # Example: 26.3   or   1.21.9-1.21.10
      version_single:
        description: One label from meta_lookup.txt (mode=single)
        type: string
        required: false              # required-ness is enforced in a step below

      # Used only when mode=list. Comma-separated labels.
      # Example: 26.3, 26.2, 1.21.11
      version_list:
        description: Comma-separated labels (mode=list)
        type: string
        required: false

      # How to pick the Modrinth-style version number (major.minor.patch):
      #   patch  → bump last digit from the matched previous version
      #   feature→ bump middle digit
      #   manual → use version_override exactly (single mode only)
      bump:
        description: How to choose the version number
        type: choice
        options: [patch, feature, manual]
        default: patch

      # Full version string when bump=manual, e.g. 97.0.0
      version_override:
        description: Full version number (only mode=single and bump=manual)
        type: string
        required: false

      # If true, merge the mods/ tree into packs that have a numeric pack_format
      # (skipped for ancient nan-format rows).
      include_mods:
        description: Include mods/ overlay when pack_format is set (non-ancient)
        type: boolean
        default: true

      # Free text stored in manifest.json as the changelog body (after auto header).
      changelog:
        description: Changelog body (stored in manifest for publish)
        type: string
        required: true               # GitHub requires non-empty if required: true

# =============================================================================
# JOB-LEVEL ENVIRONMENT
# -----------------------------------------------------------------------------
# Available to every step unless a step overrides a name.
# Keeps paths/API bases in one place instead of scattering magic strings.
# The Python script reads these same names.
# =============================================================================
env:
  LOOKUP_FILE: .github/meta_lookup.txt   # label, pack_format, [game versions]
  CONTENT_ROOT: core/content             # range folders with assets
  META_ROOT: core/meta                   # range folders with one template file each
  MODS_ROOT: mods                        # optional overlay (e.g. farmersdelight)
  MODRINTH_API: https://api.modrinth.com/v2
  GITHUB_API: https://api.github.com
  # Pin GitHub REST API version so field shapes stay stable over time
  GITHUB_API_VERSION: "2026-03-10"
  OUT_DIR: build/dist                    # where zips + manifest.json are written

# =============================================================================
# JOBS
# -----------------------------------------------------------------------------
# One job is enough: validate → github meta → build script → upload artifact.
# =============================================================================
jobs:
  build:
    # Fresh Ubuntu VM for this run (ephemeral; install nothing permanent)
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # STEP: Checkout
      # -----------------------------------------------------------------------
      # actions/checkout clones this repo into the workspace so later steps
      # can read meta_lookup.txt, core/, mods/, and the Python script.
      # Without this, the runner has no project files.
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v5

      # -----------------------------------------------------------------------
      # STEP: Validate inputs and resolve labels
      # -----------------------------------------------------------------------
      # id: plan  → later steps can read steps.plan.outputs.targets
      #
      # This step is pure bash. It does NOT build zips. It only:
      #   1) Enforces input combinations (single needs a label, etc.)
      #   2) Reads every label from meta_lookup.txt
      #   3) Builds the list TARGETS of labels this run will process
      #   4) Writes that list to GITHUB_OUTPUT as a multiline "targets" value
      # -----------------------------------------------------------------------
      - name: Validate inputs and resolve labels
        id: plan
        env:
          # Copy inputs into env vars for simpler shell quoting
          MODE: ${{ inputs.mode }}
          VERSION_SINGLE: ${{ inputs.version_single }}
          VERSION_LIST: ${{ inputs.version_list }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          # -e: exit if any command fails
          # -u: exit if we reference an unset variable
          # -o pipefail: fail if any part of a pipeline fails
          set -euo pipefail

          # --- Input rules (mirror the product decisions we locked in) ---

          if [ "$MODE" = "single" ] && [ -z "${VERSION_SINGLE// }" ]; then
            echo "Error: version_single is required when mode=single"
            exit 1
          fi

          if [ "$MODE" = "list" ] && [ -z "${VERSION_LIST// }" ]; then
            echo "Error: version_list is required when mode=list"
            exit 1
          fi

          # manual bump only makes sense for one row (one version_override)
          if [ "$BUMP" = "manual" ]; then
            if [ "$MODE" != "single" ]; then
              echo "Error: bump=manual is only allowed when mode=single"
              exit 1
            fi
            if [ -z "${VERSION_OVERRIDE// }" ]; then
              echo "Error: version_override is required when bump=manual"
              exit 1
            fi
          fi

          if [ -z "${CHANGELOG// }" ]; then
            echo "Error: changelog is required"
            exit 1
          fi

          if [ ! -f "$LOOKUP_FILE" ]; then
            echo "Error: $LOOKUP_FILE not found"
            exit 1
          fi

          if [ ! -f .github/scripts/build_resource_packs.py ]; then
            echo "Error: .github/scripts/build_resource_packs.py not found"
            exit 1
          fi

          # --- Load all labels from the lookup file ---
          # For each line: strip comments, skip blanks, take CSV field 1, trim spaces.
          # mapfile puts lines into a bash array ALL_LABELS.
          mapfile -t ALL_LABELS < <(
            sed -e 's/#.*//' -e '/^[[:space:]]*$/d' "$LOOKUP_FILE" \
              | cut -d',' -f1 \
              | sed 's/[[:space:]]*$//'
          )

          # Helper: return the label if it exists in ALL_LABELS, else error.
          resolve_label() {
            local want="$1" label
            for label in "${ALL_LABELS[@]}"; do
              [ "$label" = "$want" ] && { echo "$label"; return 0; }
            done
            echo "Error: label '$want' not found in $LOOKUP_FILE" >&2
            return 1
          }

          # --- Build TARGETS array from mode ---
          TARGETS=()
          case "$MODE" in
            single)
              # xargs trims leading/trailing whitespace from the input field
              TARGETS+=("$(resolve_label "$(echo "$VERSION_SINGLE" | xargs)")")
              ;;
            list)
              # Split on commas; resolve each non-empty piece
              IFS=',' read -ra RAW <<< "$VERSION_LIST"
              for item in "${RAW[@]}"; do
                item="$(echo "$item" | xargs)"
                [ -z "$item" ] && continue
                TARGETS+=("$(resolve_label "$item")")
              done
              if [ "${#TARGETS[@]}" -eq 0 ]; then
                echo "Error: version_list produced no labels"
                exit 1
              fi
              ;;
            all)
              TARGETS=("${ALL_LABELS[@]}")
              ;;
            *)
              echo "Error: unknown mode '$MODE'"
              exit 1
              ;;
          esac

          echo "Targets (${#TARGETS[@]}): ${TARGETS[*]}"

          # --- Publish TARGETS to later steps ---
          # Multiline output syntax:
          #   name<<EOF
          #   line1
          #   line2
          #   EOF
          # Later: steps.plan.outputs.targets  (newline-separated labels)
          {
            echo "targets<<EOF"
            printf '%s\n' "${TARGETS[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP: Fetch GitHub description and license
      # -----------------------------------------------------------------------
      # Uses the automatic github.token (no Modrinth secret needed here).
      #
      # Description: repo "About" text, with trailing decorative tokens removed
      #              so pack.mcmeta gets a plain sentence.
      # License:     GitHub’s detected license long name, else SPDX, else fallback.
      #
      # Both are written to outputs for the build script as DESCRIPTION / LICENSE.
      # -----------------------------------------------------------------------
      - name: Fetch GitHub description and license
        id: github_meta
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}    # owner/name
        run: |
          set -euo pipefail

          # GET /repos/{owner}/{repo} → JSON including .description
          REPO_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "$GITHUB_API/repos/$REPO")

          ABOUT=$(echo "$REPO_JSON" | jq -r '.description // empty')

          # Strip trailing tokens that are not plain words (kaomoji / symbols).
          # Keeps tokens that start with alnum and only use basic punctuation.
          DESCRIPTION=$(python3 - <<'PY' "$ABOUT"
          import re, sys
          about = sys.argv[1] if len(sys.argv) > 1 else ""
          plain = re.compile(r"^[A-Za-z0-9][A-Za-z0-9.!?'\-,…]*$")
          parts = about.split()
          while parts and not plain.match(parts[-1]):
              parts.pop()
          print(" ".join(parts), end="")
          PY
          )
          # If stripping removed everything, fall back to raw About
          [ -n "$DESCRIPTION" ] || DESCRIPTION="$ABOUT"

          # GET /repos/{owner}/{repo}/license → detected license metadata
          LICENSE_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: $GITHUB_API_VERSION" \
            "$GITHUB_API/repos/$REPO/license")

          LICENSE_NAME=$(echo "$LICENSE_JSON" | jq -r '.license.name // empty')
          LICENSE_SPDX=$(echo "$LICENSE_JSON" | jq -r '.license.spdx_id // empty')

          if [ -n "$LICENSE_NAME" ] && [ "$LICENSE_NAME" != "null" ]; then
            LICENSE="$LICENSE_NAME"
          elif [ -n "$LICENSE_SPDX" ] && [ "$LICENSE_SPDX" != "null" ] && [ "$LICENSE_SPDX" != "NOASSERTION" ]; then
            LICENSE="$LICENSE_SPDX"
          else
            LICENSE="See LICENSE.txt"
          fi

          echo "Description: $DESCRIPTION"
          echo "License: $LICENSE"

          # Multiline outputs for the next step / script
          {
            echo "description<<EOF"
            printf '%s\n' "$DESCRIPTION"
            echo "EOF"
            echo "license<<EOF"
            printf '%s\n' "$LICENSE"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # STEP: Build zips and manifest
      # -----------------------------------------------------------------------
      # Hands off to the external Python script. All real build logic lives there:
      #   - parse lookup rows
      #   - pick content/meta folders by game-version span vs folder names
      #   - resolve version numbers from Modrinth API (or manual)
      #   - render template placeholders
      #   - zip packs
      #   - write manifest.json
      #
      # Environment variables are the script’s only configuration interface.
      # -----------------------------------------------------------------------
      - name: Build zips and manifest
        env:
          PROJECT_SLUG: ${{ github.event.repository.name }}
          BUMP: ${{ inputs.bump }}
          VERSION_OVERRIDE: ${{ inputs.version_override }}
          INCLUDE_MODS: ${{ inputs.include_mods }}
          CHANGELOG: ${{ inputs.changelog }}
          # From previous steps:
          DESCRIPTION: ${{ steps.github_meta.outputs.description }}
          LICENSE: ${{ steps.github_meta.outputs.license }}
          TARGETS: ${{ steps.plan.outputs.targets }}
          # LOOKUP_FILE, CONTENT_ROOT, META_ROOT, MODS_ROOT, MODRINTH_API, OUT_DIR
          # come from the job-level env: block above
        run: python3 .github/scripts/build_resource_packs.py

      # -----------------------------------------------------------------------
      # STEP: Upload artifacts
      # -----------------------------------------------------------------------
      # Stores build/dist/ (all zips + manifest.json) on GitHub’s artifact storage
      # for this workflow run. You can download them from the run page, or the
      # publish workflow can pull them with actions/download-artifact + run-id.
      #
      # name: resource-pack-build  ← publish workflow must use this same name
      # -----------------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resource-pack-build
          path: build/dist/
          if-no-files-found: error   # fail the job if the script produced nothing