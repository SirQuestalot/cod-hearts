name: Sync LICENSE to Modrinth

on:
  push:
    branches: [main]
    paths:
      - 'LICENSE.txt'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Update Modrinth license
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_PROJECT_READWRITE_TOKEN }}
          PROJECT_SLUG: ${{ github.event.repository.name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          LICENSE_JSON=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${REPO}/license")

          SPDX_ID=$(echo "$LICENSE_JSON" | jq -r '.license.spdx_id // empty')
          LICENSE_NAME=$(echo "$LICENSE_JSON" | jq -r '.license.name // empty')
          LICENSE_URL="https://github.com/${REPO}/blob/main/LICENSE.txt"

          # --- Attempt 1: SPDX ID ---
          if [ -n "$SPDX_ID" ] && [ "$SPDX_ID" != "NOASSERTION" ] && [ "$SPDX_ID" != "null" ]; then
            echo "Attempting SPDX license: $SPDX_ID"

            HTTP_CODE=$(curl -sS -o /tmp/modrinth_response.txt -w "%{http_code}" \
              -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_SLUG}" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"license_id\": \"$SPDX_ID\", \"license_url\": \"$LICENSE_URL\"}")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo "License sync completed successfully using SPDX ID."
              exit 0
            fi

            echo "::warning::SPDX ID '$SPDX_ID' was rejected by Modrinth. Falling back to custom license."
          else
            echo "::warning::No valid SPDX ID detected. Falling back to custom license."
          fi

          # --- Attempt 2: Custom fallback ---
          CUSTOM_ID="${LICENSE_NAME:-Custom}"

          echo "Falling back to custom license: $CUSTOM_ID"

          HTTP_CODE=$(curl -sS -o /tmp/modrinth_response.txt -w "%{http_code}" \
            -X PATCH "https://api.modrinth.com/v2/project/${PROJECT_SLUG}" \
            -H "Authorization: $MODRINTH_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"license_id\": \"$CUSTOM_ID\", \"license_url\": \"$LICENSE_URL\"}")

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Error: Modrinth API request failed"
            cat /tmp/modrinth_response.txt
            exit 1
          fi

          echo "License sync completed successfully using custom license."
