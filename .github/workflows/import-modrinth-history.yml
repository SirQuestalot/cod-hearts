# =============================================================================
# Import Modrinth history as CHANGELOG entry 0 + GitHub Release (full mirror)
# -----------------------------------------------------------------------------
# gate:    fail fast if ## [0] or any changelog0-* exists (unless force)
# prepare: complete version fetch, downloads, warnings (no durable writes)
# commit:  get_approval → force cleanup → CHANGELOG push → release + assets
# =============================================================================
name: Import Modrinth History

concurrency:
  group: cod-hearts-automation
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      force:
        description: Replace existing ## [0] and delete all changelog0-* releases if true
        type: boolean
        default: false

env:
  IMPORT_SCRIPT: .github/scripts/import_modrinth_history.py
  RESIDUALS_SCRIPT: .github/scripts/report_residuals.py
  MODRINTH_API: https://api.modrinth.com/v2
  CHANGELOG_FILE: CHANGELOG.md
  CHANGELOG_URL: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md
  PROJECT_TYPE: resourcepack
  OUT_DIR: import-dist
  ARTIFACT_NAME: import-modrinth-history-${{ github.run_id }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fail if entry 0 already exists (unless force)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
        run: |
          set -euo pipefail
          FORCE_FLAG=false
          if [ "$FORCE" = "true" ]; then
            FORCE_FLAG=true
          fi

          if grep -qE '^## \[0\]' "$CHANGELOG_FILE"; then
            echo "Found ## [0] section in $CHANGELOG_FILE"
            if [ "$FORCE_FLAG" != "true" ]; then
              echo "Error: ## [0] already exists. Re-run with force=true to replace."
              exit 1
            fi
            echo "force=true: will replace ## [0] on commit."
          else
            echo "No ## [0] section in CHANGELOG."
          fi

          mapfile -t TAGS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name' \
              | grep -E '^changelog0-' \
              || true
          )
          if [ "${#TAGS[@]}" -gt 0 ]; then
            echo "Found existing entry-0 release tag(s): ${TAGS[*]}"
            if [ "$FORCE_FLAG" != "true" ]; then
              echo "Error: changelog0-* release(s) present: ${TAGS[*]}"
              echo "Re-run with force=true to delete them and replace ## [0]."
              exit 1
            fi
            echo "force=true: will delete these tags on commit: ${TAGS[*]}"
          else
            echo "No existing changelog0-* releases."
          fi

  prepare:
    needs: gate
    runs-on: ubuntu-latest
    outputs:
      imported_date: ${{ steps.prepare.outputs.imported_date }}
      entry_count: ${{ steps.prepare.outputs.entry_count }}
      version_numbers_json: ${{ steps.prepare.outputs.version_numbers_json }}
      review_summary: ${{ steps.prepare.outputs.review_summary }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare import artifact
        id: prepare
        env:
          PROJECT_SLUG: ${{ github.event.repository.name }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
          MODRINTH_API: ${{ env.MODRINTH_API }}
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
          OUT_DIR: ${{ env.OUT_DIR }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 "$IMPORT_SCRIPT" prepare

      - name: Upload import artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUT_DIR }}/
          if-no-files-found: error

      - name: Prepare review summary
        env:
          REVIEW_SUMMARY: ${{ steps.prepare.outputs.review_summary }}
        run: |
          set -euo pipefail
          if [ -z "${REVIEW_SUMMARY}" ]; then
            echo "Error: review_summary output is empty"
            exit 1
          fi
          printf '%s' "$REVIEW_SUMMARY"
          if [ "${REVIEW_SUMMARY: -1}" != $'\n' ]; then
            printf '\n'
          fi

  commit:
    needs: prepare
    if: ${{ needs.prepare.outputs.entry_count != '' && needs.prepare.outputs.entry_count != '0' }}
    runs-on: ubuntu-latest
    environment: get_approval
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download import artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.OUT_DIR }}

      - name: Force cleanup of existing changelog0-* releases
        id: force_cleanup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          DELETED=()
          if [ "$FORCE" != "true" ]; then
            echo "force=false: no release cleanup"
            echo "deleted_tags=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mapfile -t TAGS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
              --jq '.[].tag_name' \
              | grep -E '^changelog0-' \
              || true
          )
          for t in "${TAGS[@]+"${TAGS[@]}"}"; do
            [ -n "$t" ] || continue
            echo "Deleting release/tag $t"
            gh release delete "$t" --yes --cleanup-tag
            DELETED+=("$t")
          done
          echo "deleted_tags=${DELETED[*]}" >> "$GITHUB_OUTPUT"
          echo "Deleted ${#DELETED[@]} changelog0-* release(s)"

      - name: Write CHANGELOG entry 0
        id: commit_changelog
        env:
          OUT_DIR: ${{ env.OUT_DIR }}
          CHANGELOG_FILE: ${{ env.CHANGELOG_FILE }}
          CHANGELOG_URL: ${{ env.CHANGELOG_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_TYPE: ${{ env.PROJECT_TYPE }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          python3 "$IMPORT_SCRIPT" commit

      - name: Commit and push CHANGELOG.md
        id: git_commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          PUSHED=false
          if git diff --staged --quiet; then
            echo "No CHANGELOG.md changes to commit"
          else
            git commit -m "Update CHANGELOG.md"
            git push
            PUSHED=true
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pushed=$PUSHED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release and upload assets
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUT_DIR: ${{ env.OUT_DIR }}
          TAG: ${{ steps.commit_changelog.outputs.release_tag }}
          DATE: ${{ steps.commit_changelog.outputs.import_date }}
          TARGET_SHA: ${{ steps.git_commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TAG:-}" ]; then
            echo "Error: release tag empty"
            exit 1
          fi
          if [ -z "${TARGET_SHA:-}" ]; then
            echo "Error: target sha empty"
            exit 1
          fi
          TITLE="[0] - ${DATE}"
          NOTES="${OUT_DIR}/release-notes.md"
          if [ ! -f "$NOTES" ]; then
            echo "Error: missing $NOTES"
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Error: release $TAG still exists after cleanup"
            exit 1
          fi

          echo "Creating release tag=$TAG title=$TITLE target=$TARGET_SHA"
          gh release create "$TAG" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$TARGET_SHA"

          html_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq .html_url)"
          echo "release_url=$html_url" >> "$GITHUB_OUTPUT"
          echo "release_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "release_created=true" >> "$GITHUB_OUTPUT"

          shopt -s nullglob
          assets=("${OUT_DIR}/zips"/*.zip "${OUT_DIR}/metadata.json")
          UPLOADED=()
          for f in "${assets[@]}"; do
            [ -f "$f" ] || continue
            echo "Uploading $(basename "$f")"
            gh release upload "$TAG" "$f" --clobber
            UPLOADED+=("$(basename "$f")")
          done
          echo "uploaded_count=${#UPLOADED[@]}" >> "$GITHUB_OUTPUT"

      - name: On failure — residual (durable only)
        if: failure()
        env:
          RESIDUAL_STAGE: import
          RESIDUAL_OUTCOME: failure
          CHANGELOG_DATE: ${{ steps.commit_changelog.outputs.import_date }}
          RELEASE_TAG: ${{ steps.create_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
        run: |
          set -euo pipefail
          IMPORT_DURABLE_JSON=$(python3 - <<'PY'
          import json
          d = []
          deleted = """${{ steps.force_cleanup.outputs.deleted_tags }}""".strip()
          if deleted:
              for t in deleted.split():
                  d.append(f"deleted release/tag {t}")
          pushed = """${{ steps.git_commit.outputs.pushed }}""".strip()
          day = """${{ steps.commit_changelog.outputs.import_date }}""".strip()
          if pushed == "true" and day:
              d.append(f"CHANGELOG.md ## [0] - {day} (pushed)")
          tag = """${{ steps.create_release.outputs.release_tag }}""".strip()
          url = """${{ steps.create_release.outputs.release_url }}""".strip()
          created = """${{ steps.create_release.outputs.release_created }}""".strip()
          if created == "true" and tag:
              d.append(f"tag {tag}")
          if url:
              d.append(url)
          uploaded = """${{ steps.create_release.outputs.uploaded_count }}""".strip()
          if uploaded and uploaded != "0":
              d.append(f"uploaded {uploaded} release asset(s)")
          print(json.dumps(d))
          PY
          )
          export IMPORT_DURABLE_JSON
          echo "durable=$IMPORT_DURABLE_JSON"
          python3 "$RESIDUALS_SCRIPT"

      - name: On success — residual
        if: success()
        env:
          RESIDUAL_STAGE: import
          RESIDUAL_OUTCOME: success
          CHANGELOG_DATE: ${{ steps.commit_changelog.outputs.import_date }}
          RELEASE_TAG: ${{ steps.create_release.outputs.release_tag }}
          RELEASE_URL: ${{ steps.create_release.outputs.release_url }}
          IMPORT_VERSIONS_JSON: ${{ steps.commit_changelog.outputs.version_numbers_json }}
        run: |
          set -euo pipefail
          python3 "$RESIDUALS_SCRIPT"
